<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="asRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89AACC"/>
      <stop offset="100%" stop-color="#4E85BF"/>
    </linearGradient>
    <radialGradient id="asGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4E85BF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <circle cx="32" cy="32" r="30" fill="#080808" stroke="url(#asRing)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="28" fill="url(#asGlow)"/>

  <!-- Monogram AS -->
  <text
    x="32"
    y="41"
    text-anchor="middle"
    font-family="'Instrument Serif', 'Times New Roman', Georgia, serif"
    font-style="italic"
    font-size="28"
    font-weight="700"
    letter-spacing="-1"
    fill="#FFFFFF"
  >AS</text>
</svg>